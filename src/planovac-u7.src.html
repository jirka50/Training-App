<title>Tréninkový plánovač U7</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: phone-first single column; sticky team bar + tab strip; the plan reads like a practice clock (minute stamps down the left edge) */
:root{
  --bg:#F2F5F0;--surface:#FFFFFF;--sunk:#E6ECE4;--ink:#15231A;--muted:#56665A;--line:#D2DBD1;
  --field:#1F5A36;--field-ink:#FFFFFF;--ball:#E3B23C;--ball-ink:#2A2008;--warn:#B4471A;--ok:#2E7D4F;--line-strong:#9AAA9C;--team2:#2F68A8;
  --f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="sun"]){
  --bg:#0E1511;--surface:#16211A;--sunk:#1D2B22;--ink:#E4ECE5;--muted:#95A699;--line:#2B3B31;
  --field:#5DB27E;--field-ink:#07130C;--ball:#F0C552;--ball-ink:#241A04;--warn:#F08A5D;--ok:#6BCB8E;--line-strong:#4B5E51;--team2:#6FA6E6;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1511;--surface:#16211A;--sunk:#1D2B22;--ink:#E4ECE5;--muted:#95A699;--line:#2B3B31;
  --field:#5DB27E;--field-ink:#07130C;--ball:#F0C552;--ball-ink:#241A04;--warn:#F08A5D;--ok:#6BCB8E;--line-strong:#4B5E51;--team2:#6FA6E6;color-scheme:dark}
/* Na slunce: vysoký kontrast pro venkovní hřiště */
:root[data-theme="sun"]{
  --bg:#FFFFFF;--surface:#FFFFFF;--sunk:#EDEDED;--ink:#000000;--muted:#262626;--line:#000000;
  --field:#003D17;--field-ink:#FFFFFF;--ball:#FFC400;--ball-ink:#000000;--warn:#B00000;--ok:#00591F;--line-strong:#000000;--team2:#0038A8;color-scheme:light}
:root[data-theme="sun"] body{font-weight:700}
:root[data-theme="sun"] .card,:root[data-theme="sun"] .chip,:root[data-theme="sun"] .ib,:root[data-theme="sun"] .item{border-width:2px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:10px max(16px,env(safe-area-inset-left,0px))}
.hbar{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.brand{font:700 25px/1.1 var(--f-disp);letter-spacing:.01em;margin:0;flex:1 1 170px;min-width:0}
.brand small{display:block;font:500 13px/1.2 var(--f-body);text-transform:none;letter-spacing:0;color:var(--muted);margin-top:3px}
.hctl{display:flex;align-items:center;gap:8px;flex:1 1 260px;justify-content:flex-end;min-width:0}
.teamsel{flex:0 1 220px;min-width:0;min-height:42px;font:600 17px var(--f-disp);letter-spacing:.02em;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px}
.sun{flex:0 0 auto;width:42px;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:19px;line-height:1;padding:0}
.sun.on{background:var(--ball);color:var(--ball-ink);border-color:var(--ball)}
.coach{display:inline-flex;align-items:center;gap:6px}
.guest{font:700 11px var(--f-disp);letter-spacing:.06em;text-transform:uppercase}
.mv{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--sunk);border-radius:8px;padding:8px}
.mv select{width:auto;flex:1 1 160px}
.menu{position:relative;flex:0 0 auto}
.menu-btn{display:flex;align-items:center;gap:8px;min-height:42px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:700 17px var(--f-disp);letter-spacing:.03em;white-space:nowrap}
.burger{width:16px;height:2px;background:var(--ink);box-shadow:0 -5px 0 var(--ink),0 5px 0 var(--ink)}
.caret{color:var(--muted);font-size:13px}
.menu-list{position:absolute;right:0;top:calc(100% + 6px);z-index:20;min-width:210px;max-height:calc(100vh - 140px);overflow:auto;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.menu-h{font:700 12px var(--f-disp);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:10px 12px 2px}
.menu-h:first-child{padding-top:4px}
.menu-list button{border:0;background:none;color:var(--ink);text-align:left;font:600 17px var(--f-body);padding:11px 12px;border-radius:8px}
.menu-list button:hover{background:var(--sunk)}
.menu-list button.on{background:var(--field);color:var(--field-ink)}
@media (max-width:420px){.menu-btn .cur{display:none}}
main{display:grid;gap:16px;padding-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px;min-width:0}
h2{font:700 20px/1.15 var(--f-disp);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
h3{font:700 19px/1.15 var(--f-disp);text-transform:uppercase;letter-spacing:.03em;margin:0}
p{margin:0}
.label{font:600 13px/1.2 var(--f-disp);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:grid;gap:6px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 13px;font:600 17px var(--f-disp);font-variant-numeric:tabular-nums}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--field);color:var(--field-ink)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:15px;line-height:1.2}
.chip.on{background:var(--field);border-color:var(--field);color:var(--field-ink)}
.kid{display:inline-flex;align-items:center;gap:6px}
.kid b{font:700 15px var(--f-disp);font-variant-numeric:tabular-nums}
.kid.off{opacity:.55;text-decoration:line-through}
.kph{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:none;margin:-4px 0 -4px -6px;background:var(--sunk)}
.faces{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px;max-width:120px}
.faces .kph{width:22px;height:22px;margin:0}
.kph.ini{display:inline-grid;place-items:center;font:700 12px var(--f-disp);color:var(--muted);border:1px solid var(--line)}
.sea{margin:0;line-height:1.5}
.sea .btn{margin:4px 0 0;display:inline-block}
.att{display:grid;gap:4px}
.attrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(60px,1fr) auto;gap:10px;align-items:center;background:none;border:0;border-top:1px solid var(--line);padding:6px 0;text-align:left;color:var(--ink);font:inherit}
.attrow>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.borrow{display:grid;gap:6px;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin:6px 0}
.openbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
.bdg{font-size:16px;letter-spacing:1px;margin-left:4px}
.chip.badge.on{font-weight:700}
.chip.badge.off{opacity:.55}
.wx{display:grid;gap:6px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--sunk)}
.wx b.big{font-size:22px}
#print{display:none}
@media print{
 body:not(.printing) button:not(.aname),body:not(.printing) select,body:not(.printing) input,body:not(.printing) textarea,body:not(.printing) form,body:not(.printing) .hctl,body:not(.printing) .seg,body:not(.printing) .ctrls,body:not(.printing) .openbar,body:not(.printing) .toast,body:not(.printing) .animbox{display:none!important}
 body:not(.printing) .card{break-inside:avoid;box-shadow:none}
 @page{size:A4 portrait;margin:12mm}
 @page dip{size:A4 landscape;margin:8mm}
 .dip{page:dip}
 .pr{font:10pt/1.3 var(--f-body),sans-serif;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .pr h1{font:700 22pt/1.1 var(--f-disp),sans-serif;margin:0;color:#1F5A36}
 .pr h2{font:700 13pt var(--f-disp),sans-serif;text-transform:uppercase;letter-spacing:.05em;margin:5mm 0 2mm;color:#1F5A36}
 .pr p{margin:1mm 0}
 .pr-top{display:flex;gap:6mm;align-items:center;border-bottom:.6mm solid #1F5A36;padding-bottom:3mm;margin-bottom:3mm}
 .pr-top img{height:16mm}
 .pr-b{display:grid;grid-template-columns:18mm 1fr;gap:4mm;padding:1.8mm 0;border-bottom:.2mm solid #ccc;break-inside:avoid}
 .pr-time{font:700 13pt var(--f-disp),sans-serif}
 .pr-time small{display:block;font:400 9pt var(--f-body),sans-serif;color:#555}
 .pr-h{font-weight:700;text-transform:uppercase;font-size:9.5pt;letter-spacing:.04em;color:#1F5A36}
 .pr-a{margin:1mm 0}
 .pr-t{border-collapse:collapse;margin-top:2mm;font-size:9.5pt;width:100%}
 .pr-t th,.pr-t td{border:.2mm solid #999;padding:1mm 2mm;text-align:left;vertical-align:top}
 .pr-g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3mm 6mm}
 .pr-gear{line-height:1.8}
 .pr-gear span{white-space:nowrap;margin-right:4mm}
 body.printing>*:not(#print){display:none!important}
 body.printing{background:#fff!important;padding:0!important}
 body.printing #print{display:block}
 .dip{break-after:page;page-break-after:always;height:192mm;box-sizing:border-box;padding:4mm;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-family:var(--f-body),sans-serif;color:#17251c}
 .dip:last-child{break-after:auto;page-break-after:auto}
 .dip-in{height:100%;box-sizing:border-box;border:3mm double #1F5A36;border-radius:6mm;padding:9mm 14mm;display:grid;grid-template-rows:auto auto 1fr auto;gap:5mm;background:#fbfdf9}
 .dip-top{display:flex;align-items:center;gap:8mm}
 .dip-logo{height:24mm;width:auto}
 .dip-ball{font-size:20mm}
 .dip-t{font:700 22mm/1 var(--f-disp),sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#1F5A36}
 .dip-s{font-size:5mm;color:#4a5a50}
 .dip-mid{display:flex;align-items:center;gap:9mm}
 .dip-ph{width:42mm;height:42mm;border-radius:50%;object-fit:cover;border:1.5mm solid #1F5A36}
 .dip-n{font:700 15mm/1.05 var(--f-disp),sans-serif}
 .dip-b{display:flex;flex-wrap:wrap;gap:3mm 6mm;margin-top:3mm;font-size:5mm;font-weight:700}
 .dip-b i{font-style:normal;font-size:8mm;margin-right:1.5mm;vertical-align:middle}
 .dip-k{font-size:4.6mm}
 .dip-k ul{list-style:none;margin:2mm 0 0;padding:0;columns:2;column-gap:10mm}
 .dip-k li{margin:0 0 1.5mm;break-inside:avoid}
 .dip-f{display:flex;justify-content:space-between;gap:10mm;font-size:4.6mm}
 .dip-f span{border-top:.4mm solid #17251c;padding-top:1.5mm;min-width:70mm}
 .dip-f small{color:#4a5a50}
}
.gimg{display:block;width:100%;height:auto;border-radius:12px;margin:6px 0 10px;border:1px solid var(--line);background:#fff}
.row.hs{flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-inline:-4px;padding:2px 4px 4px;scroll-padding-inline:4px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.row.hs::-webkit-scrollbar{display:none}
.row.hs>*{flex:0 0 auto}
.em-ico{font-size:40px;line-height:1;margin:4px 0 6px}
.card.empty .row{justify-content:center}
.hint{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin:6px 0}
.kid.sel{outline:3px solid var(--ball);outline-offset:1px}
.lvl{font:700 11px var(--f-disp);letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 4px;background:var(--sunk);color:var(--muted)}
.chip.on .lvl{background:rgba(255,255,255,.2);color:inherit}
.btn{border:0;border-radius:8px;padding:11px 18px;font:700 18px/1 var(--f-disp);text-transform:uppercase;letter-spacing:.05em;background:var(--field);color:var(--field-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:16px}
.btn.ball{background:var(--ball);color:var(--ball-ink)}
.btn.danger{background:var(--surface);color:var(--warn);border:1px solid var(--warn)}
.ib{width:36px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:8px;display:inline-grid;place-items:center;font-size:16px;line-height:1;padding:0}
.star{font-size:20px;color:var(--muted)}
.star.on{color:var(--ball-ink);background:var(--ball);border-color:var(--ball)}
.pbar{display:block;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;width:100%;margin:2px 0 4px}
.pbar i{display:block;height:100%;background:var(--field)}
.rate-row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:8px}
.ib.up{background:var(--ok);border-color:var(--ok)}
.ib.down{background:var(--warn);border-color:var(--warn)}
#parentsTxt{min-height:200px;font-size:15px}
.ib:disabled{opacity:.35;cursor:default}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
textarea{min-height:84px;resize:vertical}
.kids{display:flex;flex-wrap:wrap;gap:6px}
.sumline{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.total{font:700 20px var(--f-disp);font-variant-numeric:tabular-nums}
.total.bad{color:var(--warn)}
/* timeline */
.tl{display:grid;gap:0}
.blk{display:grid;grid-template-columns:66px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.blk:first-child{border-top:0;padding-top:2px}
.clock{font:700 20px/1.2 var(--f-disp);font-variant-numeric:tabular-nums;color:var(--muted)}
.clock small{display:block;font:600 11px/1.15 var(--f-disp);letter-spacing:.03em;overflow-wrap:anywhere;text-transform:uppercase}
.bbody{display:grid;gap:8px;min-width:0}
.aname{font:700 20px/1.15 var(--f-disp);background:none;border:0;padding:0;text-align:left;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.aname:hover{text-decoration-color:var(--field)}
.ctrls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
select.btype{width:auto;padding:6px 10px;font-size:15px;min-height:0}
.item.cur{outline:2px solid var(--field)}
.mins{display:inline-flex;align-items:center;gap:6px;font:700 17px var(--f-disp);font-variant-numeric:tabular-nums;margin-right:6px}
.st-list{display:grid;gap:8px}
.st{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--sunk);border-radius:8px;padding:8px 10px;min-width:0}
.st .tag{font:700 15px var(--f-disp);background:var(--field);color:var(--field-ink);border-radius:6px;padding:3px 7px;white-space:nowrap}
.st .aname{font-size:18px}
.mx-wrap{overflow-x:auto}
table.mx{border-collapse:collapse;font-size:15px;min-width:100%}
table.mx th,table.mx td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.mx th{font:600 14px var(--f-disp);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--sunk);white-space:nowrap}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.grp{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px;align-content:start}
.grp-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grp-h h3{font-size:18px}
.gear{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.gear label{display:flex;gap:10px;align-items:flex-start}
.gear input{width:20px;height:20px;margin-top:1px;accent-color:var(--field)}
/* library */
.lib-list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;width:100%}
.item h3{font-size:19px}
.item .meta{grid-column:1/-1;font-size:14px;color:var(--muted)}
.ag{color:var(--ink);font-weight:700}
.kb{font:700 12px var(--f-disp);letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:2px 6px;align-self:start;white-space:nowrap}
.kb.game{background:var(--field);color:var(--field-ink)}
.kb.drill{background:var(--ball);color:var(--ball-ink)}
.kb.seq{background:var(--team2);color:var(--surface)}
.animbox{display:grid;gap:6px;justify-items:start;width:100%;max-width:520px}
.anim{width:100%;height:auto;display:block;border-radius:8px}
.acap{font:600 17px/1.25 var(--f-disp);letter-spacing:.02em;min-height:1.3em;text-align:left}
.modeseg button{font-size:15px;padding:6px 10px}
.modeseg button:disabled{opacity:.45;cursor:default}
.steps-list{margin:0;padding-left:20px;display:grid;gap:8px;text-align:left;width:100%}
.kb.routine{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
/* field mode */
.now{display:grid;gap:10px;text-align:center;justify-items:center}
.timer{font:700 clamp(72px,24vw,132px)/1 var(--f-disp);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.timer{border-radius:18px;padding:2px 22px;transition:background .3s,color .3s}
.timer.ok{background:var(--field);color:var(--field-ink)}
.timer.last{background:var(--ball);color:#1b1b12}
.timer.over{background:var(--warn);color:#fff}
.prog[data-st=last] i{background:var(--ball)}
.prog[data-st=over] i{background:var(--warn)}
.now-l,.now-r{display:grid;gap:10px;justify-items:center;width:100%}
.fbar{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:64px minmax(0,1fr) 64px 64px;gap:8px;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);box-shadow:0 -8px 12px -10px rgba(0,0,0,.35);margin-top:4px}
.fb{height:64px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 24px/1 var(--f-disp)}
.fb.main{background:var(--field);color:var(--field-ink);border:0;font-size:24px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden}
.fb.main i{font-style:normal;font-size:.7em;margin-right:6px;vertical-align:.08em}
.fb.main.run{background:var(--surface);color:var(--ink);border:2px solid var(--field)}
.fb:disabled{opacity:.35}
@media (orientation:landscape) and (max-height:540px){
 .now{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:start;text-align:left}
 .now-l{position:sticky;top:8px}
 .timer{font-size:clamp(64px,26vh,120px)}
 .fbar{grid-template-columns:72px minmax(0,1fr) 72px 72px;max-width:640px;margin-inline:auto}
 .fb{height:56px}
}
.prog{height:10px;width:100%;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ball);width:0}
.now .aname{font-size:28px;text-align:center}
.cue{background:var(--sunk);border-radius:8px;padding:10px 12px;text-align:left;font-size:16px;width:100%}
.steps{display:grid;gap:4px}
.stp{display:grid;grid-template-columns:52px 1fr auto;gap:8px;padding:6px 8px;border-radius:6px;background:none;border:0;text-align:left;width:100%}
.stp.cur{background:var(--sunk);font-weight:700}
.stp.done{color:var(--muted)}

{id:'g01',k:'game',n:'Ukliď si zahrádku',v:'Přehazovaná',c:'hazeni',t:['tym'],e:3,min:8,kids:6,

 d:'Hřiště se rozdělí čárou (kužely nebo lano) na dvě poloviny, každý tým má svoji „zahrádku“. Na obou stranách leží hromada měkkých míčků. Na povel děti sbírají míčky na své straně a házejí je vrchním hodem přes čáru k soupeři. Na zapískání všichni přestanou a spočítá se, kolik míčků zůstalo na každé straně. Vyhrává tým s „čistší zahrádkou“. Hraje se 3–4 kola po 1–2 minutách.',

{id:'g02',k:'game',n:'Pirátský poklad',c:'hazeni',e:1,min:8,kids:2,st:1,

{id:'g03',k:'game',n:'Štafeta s míčem',v:'Vlak',c:'hazeni',t:['chytani','tym'],e:2,min:8,kids:6,

{id:'g04',k:'game',n:'Raketa',c:'hazeni',e:2,min:7,kids:1,st:1,out:1,

{id:'g05',k:'game',n:'Trenérská vybíjená',v:'Míčová lavina',c:'hazeni',t:['warm'],e:3,min:7,kids:4,

{id:'g07',k:'game',n:'Sbírání vajíček',v:'Brankář',c:'chytani',e:2,min:8,kids:2,st:1,

{id:'g09',k:'game',n:'Žonglér',c:'chytani',e:1,min:5,kids:1,st:1,

{id:'g12',k:'game',n:'Odpal a běž',c:'odpal',t:['mety'],e:2,min:10,kids:4,st:1,

{id:'g15',k:'game',n:'Autopark na metách',v:'Semafor, Barevné mety',c:'mety',t:['warm','hra'],e:3,min:8,kids:3,

{id:'g17',k:'game',n:'Trenér říká',c:'hra',e:1,min:5,kids:2,

{id:'g18',k:'game',n:'Vláček a mini zápas',c:'hra',t:['odpal','mety'],e:2,min:15,kids:6,match:1,

{id:'g19',k:'game',n:'Přenášení pokladu',c:'hra',e:1,min:6,kids:2,st:1,

{id:'g23',k:'game',n:'Invaze medvědů',c:'warm',e:3,min:6,kids:4,

 va:'Vlny: dva až tři trenéři se drží za ruce, vybíhají proti dětem a zvedají a spouštějí ruce. Děti se snaží proběhnout a nenechat se chytit.'},
{id:'g25',k:'game',n:'Chobotnice',c:'warm',t:['hra'],e:3,min:7,kids:6,
 gear:['Měkké míčky', 'Pěnové nudle', 'Kužely'],gn:'kužely na domečky v rozích',dev:'orientace v prostoru, týmová spolupráce, koordinace těla, úchop míče',
 d:'Trenér stojí uprostřed s míčky u nohou a točí pěnovou nudlí jako chapadlem. Děti jsou ve 3–4 týmech v rozích. Vždy vybíhá jeden z týmu, sleduje chapadlo, vezme míček a donese ho do domečku. Když se ho chapadlo dotkne, vrací se bez míčku. Vyhrává tým s nejvíce míčky.'},
{id:'g26',k:'game',n:'Tečovaná',c:'warm',e:3,min:7,kids:4,co:2,
 gear:['Rukavice', 'Měkké míčky', 'Kužely'],gn:'2–3 rukavice pro trenéry',dev:'obratnost, rychlost, bystrost, rozehřátí',
 d:'Dva až tři trenéři mají rukavici a přihazují si míč. Trenér s míčem se nesmí hýbat nohama, jen se natahuje, a tečuje běžce míčem v rukavici. Tečovaný si jde „dobít život“: vyběhne k dalšímu trenérovi mimo plochu, vezme míč, hodí mu ho do rukavice a vrací se do hry.'},
{id:'g27',k:'game',n:'Ocásky',c:'warm',e:3,min:6,kids:4,
 gear:['Látkové pásky na ocásky'],gn:'pro každé dítě, stačí i čepice',dev:'orientace v prostoru, mrštnost, pozornost, běh',
 d:'Každé dítě má vzadu za kalhotami „ocásek“ a běhá po vymezeném prostoru. Děti si navzájem ocásky berou. Vyhrává ten, kdo jich nasbírá nejvíce.'},
{id:'g28',k:'game',n:'Baseballový mrazík',c:'warm',t:['chytani'],e:3,min:7,kids:5,
 gear:['Rukavice', 'Malé fotbalové míče', 'Velké měkké míče'],gn:'velký balón jen pro variantu',dev:'tečování, práce s míčem, orientace v prostoru, rychlost a bystrost',
 d:'Mrazíci mají rukavice a zamrazují tečováním. Sluníčka mají malé fotbalové míče a rozmrazují předáním míče, míč si nechává rozmrazený hráč. Mrazíci se po čase obměňují.',
 va:'Zmrazené dítě rozmrazí podlezení nebo chycený velký měkký balón; kdo balón chytí, stává se sluníčkem.'},
{id:'g29',k:'game',n:'Nemocniční kopaná',c:'warm',e:3,min:7,kids:4,
 gear:['Malé fotbalové míče', 'Kužely'],gn:'kužely na vyznačení nemocnice',dev:'koordinace nohou, pohyb v poli, sledování míče a soupeře, pozice pod míčem',
 d:'Hráči vedou malé fotbalové míče nohama a navzájem se tečují rukou nebo dotykem soupeřova míče. Po první teči se drží za jedno rameno, po druhé za druhé, po třetí jdou do nemocnice: tam si třikrát vyhodí míč nad hlavu a dají hlavičku, pak se vrací.'},
{id:'g30',k:'game',n:'Pirátské ostrovy',c:'warm',t:['mety'],e:3,min:8,kids:6,
 gear:['Malé fotbalové míče', 'Kužely', 'Mety'],dev:'koordinace nohou, pohyb v poli, sledování svého míče i soupeře',
 d:'Z kuželů se kolem met vytvoří 4 ostrovy. Námořníci vedou míče nohama, musí obeplout všechny ostrovy a vrátit se na domácí metu. Dva piráti uprostřed je tečují nebo jim seberou odkopnutý míč. Chycený se stává pirátem. Na ostrovech jsou námořníci v bezpečí.'},
{id:'g31',k:'game',n:'Trenér velí míče na zem!',v:'Na magnety',c:'warm',t:['hra'],e:3,min:6,kids:2,
 gear:['Malé fotbalové míče'],gn:'varianta Na magnety je bez pomůcek',dev:'poslouchání trenéra, soustředění, koordinace, rychlá reakce na povel, padání a zvedání',
 d:'Hráči si chodí po hřišti a vyhazují míče. Trenér zakřičí povel a děti ho co nejrychleji splní, míč vždy položí na zem: „zadek na míč“, „břicho na míč“, „koleno na míč“, „ucho na míč“, „loket na míč“…',
 va:'Na magnety: na píšťalku trenér zavolá třeba „Magnet na kolena!“ a děti se bleskově přilepí ke kamarádovi koleny. Kdo zbude, udělá 3 dřepy.'},
{id:'g32',k:'game',n:'Na babu po metách',c:'warm',t:['mety'],e:3,min:6,kids:4,
 gear:['Mety'],gn:'místo met jdou kužely nebo obruče',dev:'rychlost, změna směru, orientace na hřišti, znalost met',
 d:'Klasická honička, kde jsou mety „domečky“. Jeden nebo dva honiči (podle počtu dětí) chytají ostatní. Kdo stojí na metě, je v bezpečí, ale nejdéle 5 vteřin a na jedné metě smí stát jen jedno dítě. Když přiběhne další, ten první musí metu opustit. Koho honič chytí, stává se honičem.',
 va:'Pojmenované mety: trenér zavolá „první!“ nebo „třetí!“ a ta meta je na chvíli zavřená, nikdo na ní nesmí stát.',
 kid:'„Meta je domeček, ale jen na pět vteřin: pět, čtyři, tři…“'},
{id:'g33',k:'game',n:'Opičí dráha',c:'warm',t:['hazeni'],e:3,min:7,kids:2,
 gear:['Kužely', 'Obruče', 'Měkké míčky', 'Kbelíky'],gn:'4 kužely na slalom, 3 obruče, kbelík na konci',dev:'obratnost, skoky snožmo, koordinace, hod na cíl po pohybu',
 d:'Postav dráhu: slalom mezi 4 kužely, potom 3 obruče za sebou (skoky snožmo), na konci čára, odkud se hází míček do kbelíku. Děti vyrážejí jedno po druhém, další startuje, když je předchozí v obručích. Po hodu dítě míček sebere a běží zpět na konec řady. Postupně se dá přidat podlézání (nudle mezi dvěma kužely) nebo couvání.',
 va:'Závod družstev: dvě stejné dráhy vedle sebe, počítá se, kolik míčků družstvo dostane do kbelíku, než projdou všichni.',
 kid:'„Slalom jako lyžař, skoky jako žabka a na konci trefa do kbelíku!“'},
{id:'g34',k:'game',n:'Kolem met',v:'Čtyři rohy',c:'hazeni',t:['chytani','tym'],e:2,min:7,kids:4,
 gear:['Mety', 'Měkké míčky', 'Rukavice', 'Stopky'],gn:'mety blíž k sobě (8–10 m)',dev:'chytání a rychlý hod na spoluhráče, otočení k cíli, přesnost, týmová spolupráce',
 d:'Na každé metě stojí jedno dítě (na domácí metě taky). Míček putuje od domácí mety na první, druhou, třetí a zpátky domů – to je jedno kolo. Kdo chytí, otočí se k další metě a hodí. Trenér měří, kolik kol tým stihne za minutu, a pak se to snaží překonat. Po každém pokusu se děti posunou o metu dál. Když míček upadne, sebere ho ten, komu byl určen, a hra pokračuje.',
 va:'Čtyři rohy: kužely ve čtverci asi 8 m od sebe, na každém rohu dítě. Kdo hodí, běží za svým míčkem na další roh, takže se děti točí s míčkem dokola.',
 kid:'„Chyť, otoč se k další metě, hoď! Kolik kol dáme?“',
 link:'https://mojo.sport/coachs-corner/10-best-baseball-drills-for-7-and-8-year-olds/',lt:'MOJO – Four Corners'},
{id:'g35',k:'game',n:'Sestřel kužel',c:'hazeni',e:1,min:7,kids:2,st:1,
 gear:['Kužely', 'Měkké míčky', 'Mety'],gn:'kužely nebo helmy postavené na metách či kbelících',dev:'přesnost hodu, míření, vrchní hod s krokem',
 d:'Na metách nebo obrácených kbelících stojí kužely (nebo helmy) asi 5–7 m od čáry. Děti stojí za čarou a házejí vrchním hodem s krokem. Shozený kužel = bod pro družstvo, trenér ho hned postaví zpátky. Blízký kužel stojí bod, vzdálenější dva.',
 va:'Kuželkový král: uprostřed stojí jeden „královský“ kužel, za který jsou 3 body, ale shodit ho smí jen ten, kdo předtím shodil obyčejný.',
 kid:'„Rukavice ukáže na kužel, krok a bum!“'},
{id:'g36',k:'game',n:'Zem nebo nebe',c:'chytani',e:2,min:6,kids:2,st:1,
 gear:['Měkké míčky'],gn:'měkké nebo tenisové míčky, bez rukavic',dev:'chytání holýma rukama, rozlišení přízemního a vysokého míče, postoj polaře',
 d:'Děti stojí v řadě 5–6 m před trenérem, bez rukavic. Trenér střídá přízemní míč („zem“) a vysoký míč („nebe“). Na přízemák dítě zaujme postoj polaře a míček nabere oběma rukama, na vysoký míč dá ruce nahoru, palce k sobě. Míček vrátí trenérovi a jde na konec řady. Trenér předem nehlásí, co přijde.',
 va:'Hlasitá verze: děti musí ještě před chycením zakřičet „zem!“ nebo „nebe!“.',
 kid:'„Zem? Ruce dolů jako krokodýl. Nebe? Ruce nahoru, palečky k sobě!“',
 link:'https://www.mojo.sport/coachs-corner/10-best-baseball-drills-for-9-and-10-year-olds',lt:'MOJO – Grab Bag'},
{id:'g37',k:'game',n:'Běž do pole!',c:'hra',t:['warm'],e:3,min:6,kids:2,out:1,
 gear:['Kužely'],gn:'tři kužely: levé, střední a pravé pole',dev:'pozice v poli, orientace na hřišti, reakce na povel, rychlost',
 d:'Trenér vezme děti do vnějšího pole a ukáže tři kužely: levé, střední a pravé pole. Pak se všichni vrátí k domácí metě. Trenér zavolá pole a děti tam co nejrychleji doběhnou a zaujmou postoj polaře. Kdo je tam první, může zavolat další pole. Později se dají přidat vnitřní pozice (první, druhá, třetí meta, spojka).',
 va:'Bez ukazování: trenér jen zavolá pozici a děti si samy musí vzpomenout, kde je.',
 kid:'„Levé, střed, nebo pravé? Kdo tam bude první?“',
 link:'https://www.littleleague.org/?p=11401',lt:'Little League – Tee Ball Program'},
{id:'g38',k:'game',n:'Závod s míčkem',c:'mety',t:['hazeni','chytani'],e:3,min:8,kids:5,
 gear:['Mety', 'Měkké míčky', 'Rukavice'],dev:'běh kolem met, rychlé přihrávky, chytání, týmová spolupráce',
 d:'Na každé metě stojí polař. Běžec vyrazí z domácí mety a oběhne všechny mety. Ve stejnou chvíli trenér hodí míček na první metu a polaři si ho posílají první – druhá – třetí – domů. Kdo bude doma dřív, běžec, nebo míček? Když míček upadne, musí ho polař sebrat a hodit znovu. Běžci a polaři se střídají.',
 va:'Dva běžci naráz: druhý vybíhá, až je první na druhé metě. Polaři pak musí míček poslat dvakrát dokola.',
 kid:'„Běžče, utíkej! Polaři, rychle chytit a hodit!“'},
{id:'g39',k:'game',n:'Doručte míček',c:'hra',t:['hazeni','chytani'],e:3,min:7,kids:6,
 gear:['Měkké míčky', 'Kužely'],gn:'kužely na hranice hřiště a zónu kapitána',dev:'útok a obrana, přihrávka volnému spoluhráči, pohyb bez míče, komunikace',
 d:'Dvě družstva. Na konci hřiště stojí v zóně z kuželů kapitán útočníků. Útočníci si přihrávají (s míčkem v ruce se nesmí běhat) a snaží se míček dostat až ke kapitánovi. Obránci se snaží přihrávku chytit nebo míček zachytit na zemi. Povedená doručení = bod, pak se role prohodí. Hraje se v malých skupinkách 3 na 3 nebo 4 na 4.',
 va:'Lehčí verze pro začátečníky: obránci smí jen chodit, ne běhat.',
 kid:'„S míčkem stůj, bez míčku běž na volné místo a volej!“',
 link:'https://www.littleleague.org/?p=11401',lt:'Little League – Offense & Defense'},
{id:'g40',k:'game',n:'Odpal a kbelík',c:'hra',t:['odpal','mety','hazeni'],e:3,min:10,kids:5,
 gear:['Tee (stojánek)', 'Pálky', 'Helmy', 'Měkké míčky', 'Rukavice', 'Mety', 'Kbelíky', 'Obruče'],gn:'kbelík na místě nadhazovače',dev:'odpal a start, běh kolem met, polaři zpracují míč a hodí do cíle, herní rozhodování',
 d:'Pálkař odpálí z tee, pálku položí do obruče a běží kolem met. Polaři míček co nejrychleji zpracují a hodí (nebo donesou) do kbelíku na místě nadhazovače. Ve chvíli, kdy je míček v kbelíku, trenér zavolá „stop!“ a pálkař dostane bod za každou metu, kterou stihl. Každý pálí 2–3×, pak výměna.',
 va:'Týmová: pálí všichni z jednoho družstva po sobě a body se sčítají, pak se družstva vymění.',
 kid:'„Polaři, míček do kbelíku! Běžče, kolik met stihneš?“'},
{id:'g41',k:'game',n:'Krokodýli na metách',c:'chytani',t:['mety'],e:2,min:7,kids:5,
 gear:['Mety', 'Měkké míčky', 'Rukavice'],gn:'koš míčků pro trenéra',dev:'chytání přízemních míčů, krokodýlí tlama, hod zpět, běh kolem met',
 d:'„Krokodýli“ s rukavicí stojí u každé mety. Trenér uprostřed kutálí míčky ke krokodýlům, ti je „snědí“ krokodýlí tlamou a hodí zpátky. Mezitím druhé družstvo „běžců“ obíhá mety. Krokodýli dostávají bod za každý chycený míček, běžci za každé celé kolo. Po 2 minutách se družstva vymění a porovnají se body.',
 va:'Hladový krokodýl: kdo nechá míček proklouznout mezi nohama, musí si pro něj doběhnout a teprve pak hodit zpět.',
 kid:'„Krokodýl má tlamu u země – ham a míček je snězený!“'},
/* --- CVIKY --- */
{id:'d01',k:'drill',n:'Držení míče',c:'hazeni',e:1,min:5,kids:1,st:1,gear:['Měkké míčky'],gn:'míček pro každé dítě',
 dev:'správný úchop míče, příprava na hod',
 d:'Dítě drží míč dvěma prsty nahoře (ukazovák a prostředník) a palcem dole, z boku je vidět písmeno C. Míč se nedrží v dlani. Trenér řekne „ukaž céčko“ a děti zvednou míč. Pak hledají šev a pokládají prsty přes něj.',
 kid:'„Míček držíme jako vajíčko, dva prstíky nahoře, palec dole. Ukaž mi céčko!“'},
{id:'d02',k:'drill',n:'Hod z kolena',c:'hazeni',e:1,min:6,kids:2,st:1,gear:['Měkké míčky', 'Rukavice'],
 dev:'rotace trupu, práce paže, dotažení hodu',
 d:'Dvojice 4–5 m od sebe. Dítě klečí na koleni na straně házecí ruky, druhá noha vpředu. Rukavice ukáže na partnera, házecí ruka jde dozadu „do kapsy“ a nahoru, hod a ruka dotáhne až ke koleni. 10 hodů, pak výměna.',
 kid:'„Rukavice ukáže na kamaráda, ruka letí nahoru jako letadlo a na konci plácne do kolena.“'},
{id:'d03',k:'drill',n:'Ukaž – krok – hoď',c:'hazeni',e:2,min:7,kids:2,st:1,gear:['Měkké míčky', 'Rukavice', 'Kužely'],
 dev:'krok opačnou nohou, rytmus hodu, přesnost',
 d:'Děti stojí bokem k cíli (trenér nebo síť). Trenér počítá nahlas: „Ukaž“ (rukavice na cíl), „krok“ (krok nohou opačnou k házející ruce), „hoď“ (hod a dotažení). Nejdřív bez míče, pak s míčem. Vzdálenost postupně prodlužovat.',
 kid:'„Ukaž, krok, hoď! Rukavicí míříš, nohou kročíš, rukou hodíš.“'},
{id:'d04',k:'drill',n:'Hod na síť nebo zeď',c:'hazeni',e:2,min:6,kids:1,st:1,gear:['Měkké míčky', 'Síť nebo plachta', 'Kužely'],gn:'koš míčků; místo sítě jde i stěna',
 dev:'opakování hodu, rychlý cyklus „seber–hoď“',
 d:'Každé dítě má u kuželu 3–4 míčky a hází je vrchním hodem na síť nebo zeď z 5–6 m. Po vyházení míčky sesbírá a začíná znovu. Hodně opakování bez čekání, trenér opravuje jednotlivce.',
 kid:'„Kdo dřív vyhází své míčky a správně je sebere?“'},
{id:'d05',k:'drill',n:'Krokodýlí tlama ve dvojicích',c:'chytani',e:1,min:6,kids:2,st:1,gear:['Měkké míčky', 'Rukavice'],
 dev:'chytání přízemních míčů, postoj, souhra obou rukou',
 d:'Dvojice sedí nebo stojí rozkročeně 3–4 m od sebe a kutálí si míček. Chytající má rukavici otevřenou u země („spodní čelist“) a druhou ruku nad ní („horní čelist“). Po chycení tlama zaklapne. Postupně ze stoje a z větší dálky.',
 kid:'„Krokodýl má tlamu dole u země, a když míček přijde – ham!“'},
{id:'d06',k:'drill',n:'Palce a malíčky',c:'chytani',e:1,min:6,kids:1,st:1,gear:['Měkké míčky', 'Rukavice'],
 dev:'postavení rukavice podle výšky míče',
 d:'Trenér hází měkké míčky spodem z 3–4 m. Míč nad pasem chytáme „palci k sobě“ (prsty rukavice nahoru), míč pod pasem „malíčky k sobě“ (prsty dolů). Trenér předem zavolá „palce“ nebo „malíčky“, později už nevolá.',
 kid:'„Vysoko? Palečky! Nízko? Malíčky!“'},
{id:'d07',k:'drill',n:'Krabí krok k míči',c:'chytani',e:2,min:6,kids:2,st:1,gear:['Kužely', 'Měkké míčky', 'Rukavice'],
 dev:'přesun bokem, postavení se před míč',
 d:'Dva kužely 3 m od sebe. Dítě v postoji polaře se posouvá bokem jako krab (nohy se nekříží) a trenér kutálí míč střídavě ke kuželům. Dítě se postaví před míč a chytí ho krokodýlí tlamou.',
 kid:'„Krab běhá bokem a nohy si nepřekříží. Postav se míčku do cesty!“'},
{id:'d08',k:'drill',n:'Chyť a přendej',c:'chytani',t:['hazeni'],e:2,min:6,kids:2,st:1,gear:['Měkké míčky', 'Rukavice'],
 dev:'rychlé přehození míče z rukavice do házecí ruky',
 d:'Dvojice 4 m od sebe. Po chycení dítě obě ruce přitáhne k hrudi („k pupíku“), přendá míč do házecí ruky a hodí zpět. Počítá se, kolik výměn dvojice zvládne za 30 sekund bez upuštění.',
 kid:'„Chyť, přitáhni k bříšku, vezmi a hoď!“'},
{id:'d09',k:'drill',n:'Postoj a úchop pálkaře',c:'odpal',e:1,min:5,kids:1,st:1,gear:['Pálky', 'Mety'],gn:'místo pálek jdou pěnové nudle, místo met kužely',
 dev:'postoj pálkaře, úchop pálky, bezpečná vzdálenost',
 d:'Každé dítě stojí u své mety nebo kuželu. Nohy na šířku ramen, kolena lehce pokrčená, pálka nad zadním ramenem. Úchop „klepání na dveře“: kloubky obou rukou v jedné řadě, ruce u sebe. Trenér kontroluje a děti si to „vyfotí“ (zamrznou).',
 kid:'„Ruce si zaklepou na dveře, pálka sedí na rameni jako papoušek.“'},
{id:'d10',k:'drill',n:'Švih na povel',c:'odpal',e:1,min:5,kids:1,st:1,gear:['Pálky'],gn:'nebo pěnové nudle; velké rozestupy',
 dev:'pořadí pohybu při švihu',
 d:'Děti stojí v řadě s velkými rozestupy, všechny čelem stejným směrem. Trenér volá: „Kouknout“ (hlava k nadhazovači), „krok“ (malý krok přední nohou), „otočit“ (boky a pupík k nadhazovači, švih). Nejdřív pomalu, pak plynule.',
 kid:'„Kouknout, krok, otočit pupík!“'},
{id:'d11',k:'drill',n:'Tee do sítě',c:'odpal',e:1,min:8,kids:1,st:1,gear:['Tee (stojánek)', 'Pálky', 'Helmy', 'Měkké míčky', 'Síť nebo plachta'],gn:'koš míčků',
 dev:'kontakt s míčem, opakování švihu',
 d:'Tee stojí 2–3 m před sítí. Dítě má 5 odpalů za sebou, trenér pokládá míčky na tee a opravuje jednu věc (postoj, oči na míči, dokončení švihu). Ostatní děti mezitím sbírají míčky nebo dělají švihy na sucho mimo dosah.',
 kid:'„Oči na míček až do konce, a pak teprve koukej, kam letí.“'},
{id:'d12',k:'drill',n:'Polož pálku a běž',c:'odpal',t:['mety'],e:2,min:6,kids:2,st:1,gear:['Pálky', 'Obruče', 'Mety'],
 dev:'bezpečné odložení pálky, start po odpalu',
 d:'Dítě udělá švih (s míčem z tee nebo bez), pálku položí do obruče vedle domácí mety a vyrazí na první metu. Pálka, která letí vzduchem, znamená návrat a nový pokus. Trenér stojí bezpečně stranou.',
 kid:'„Pálka si jde lehnout do postýlky, pak teprve utíkáme.“'},
{id:'d13',k:'drill',n:'Proběhni první metu',c:'mety',e:3,min:6,kids:2,st:1,gear:['Mety', 'Kužely'],gn:'kužel 3 m za první metou',
 dev:'běh přes první metu, šlápnutí na metu, zastavení za ní',
 d:'Děti startují od domácí mety a běží přes první metu až ke kuželu za ní. Na metě se nezastavují, jen na ni šlápnou. Za kuželem se otočí doprava a podívají se na trenéra.',
 kid:'„První metu probíháme jako cílem, nezastavujeme na ní!“'},
{id:'d14',k:'drill',n:'Banánek kolem met',c:'mety',e:3,min:6,kids:2,st:1,gear:['Mety', 'Kužely'],gn:'kužely na oblouk',
 dev:'obíhání met obloukem, šlapání na vnitřní roh mety',
 d:'Kužely vyznačí oblouk („banánek“) před první metou. Děti běží z domácí mety po oblouku, šlápnou na vnitřní roh první mety a pokračují na druhou. Trenér na metě ukazuje, kam šlápnout.',
 kid:'„Běžíme jako banán, ne do rohu. Šlápni na metu blíž ke hřišti!“'},
{id:'d15',k:'drill',n:'Start na povel',c:'mety',t:['hra'],e:3,min:5,kids:2,st:1,gear:['Mety'],
 dev:'reakce, start z mety a návrat na metu',
 d:'Děti stojí jednou nohou na metě. Trenér volá „Běž!“ (sprint na další metu), „Zpátky!“ (návrat na metu) nebo zvedne ruku (zůstat stát). Povely střídat rychle, aby děti poslouchaly.',
 kid:'„Noha na metě, uši nastražené!“'},
{id:'d16',k:'drill',n:'Kam hodím?',c:'hra',t:['hazeni'],e:2,min:6,kids:3,st:1,gear:['Mety', 'Měkké míčky', 'Rukavice'],
 dev:'herní myšlení, hod na první metu',
 d:'Trenér kutálí míč polaři a nahlas řekne situaci: „Běžec běží na první!“ Polař míč chytí a hodí na první metu, kde stojí spoluhráč nebo trenér. Později trenér situace střídá (domů, na druhou).',
 kid:'„Kdo má míček, myslí rychle: kam ho hodím?“'},
{id:'d17',k:'drill',n:'Připravený polař',c:'chytani',t:['hra'],e:1,min:5,kids:1,st:1,gear:['Rukavice'],
 dev:'postoj polaře, připravenost na míč',
 d:'Děti stojí na svých pozicích v poli. Trenér volá „Připravit!“ a děti zaujmou postoj: nohy od sebe, kolena pokrčená, ruce vpředu, váha na špičkách. Trenér předvede nadhoz na sucho a děti udělají dva malé skoky vpřed („hop-hop“).',
 kid:'„Pilka, kolena, rukavice dolů – a hop-hop!“'},
{id:'d18',k:'drill',n:'Odrazy od zdi',c:'chytani',t:['hazeni'],e:1,min:5,kids:1,st:1,gear:['Měkké míčky', 'Síť nebo plachta'],gn:'tenisák pro každé dítě; potřeba stěna nebo odrazová síť',
 dev:'chytání po odrazu, sledování míče, souhra očí a rukou, samostatné opakování',
 d:'Každé dítě stojí 2–3 m od stěny (v hale) nebo odrazové sítě a hází tenisák spodem proti zdi. Odražený míček chytá oběma rukama, později do rukavice. Počítá, kolikrát za sebou chytí bez upuštění. Pokročilí házejí vrchem, nechají míček jednou odskočit od země nebo chytají jen rukavicí.',
 kid:'„Hoď o zeď, chyť oběma rukama! Kolikrát to dáš za sebou?“'},
{id:'d19',k:'drill',n:'Pohyblivý stojan',c:'odpal',e:1,min:8,kids:1,st:1,gear:['Tee (stojánek)', 'Pálky', 'Helmy', 'Měkké míčky', 'Síť nebo plachta'],gn:'stojan s nastavitelnou výškou',
 dev:'odpal z různých výšek a míst, přizpůsobení švihu, sledování míče',
 d:'Dítě odpaluje z tee do sítě. Po každém odpalu trenér stojan posune: blíž k tělu, dál od těla, výš nebo níž. Dítě si musí najít správný postoj a míček trefit tam, kde zrovna je. Začni velkými změnami, pak jemnějšími. Pálkař vždy v helmě, ostatní za čarou.',
 kid:'„Kde je míček teď? Najdi ho a trefuj!“',
 link:'https://thehittingvault.com/?p=2660',lt:'The Hitting Vault – Moving Tee'},
{id:'d20',k:'drill',n:'Obří míč na tee',c:'odpal',e:1,min:6,kids:1,st:1,gear:['Tee (stojánek)', 'Pálky', 'Helmy', 'Velké měkké míče', 'Měkké míčky'],gn:'velký měkký nebo malý fotbalový míč položený na tee či kužel',
 dev:'první úspěšné odpaly, odvaha švihnout, sledování míče, rovný švih',
 d:'Na tee (nebo kužel) se položí velký měkký míč. Dítě ho švihem shodí co nejdál. Velký cíl znamená jistý zásah, takže se dítě může soustředit na postoj a celý švih. Po několika úspěšných odpalech se míč vymění za menší, až po normální měkký míček.',
 kid:'„Velký míč, velký zásah – a teď zkusíme menší!“'},
{id:'d21',k:'drill',n:'Skoky mezi metami',c:'mety',t:['warm'],e:3,min:5,kids:1,gear:['Mety'],
 dev:'běh po metách ve správném pořadí, koordinace, různé způsoby pohybu, šlápnutí na metu',
 d:'Děti obíhají mety, ale každý úsek jinak: z domácí na první poskoky, z první na druhou snožmo jako žabka, z druhé na třetí bokem jako krab, ze třetí domů sprint. Na každou metu se musí šlápnout. Děti vybíhají po jednom, další startuje, když je předchozí na první metě. Způsoby pohybu se dají střídat (pozpátku, po jedné noze, jako slon).',
 kid:'„Poskoky, žabka, krab a domů sprint! A na každou metu šlápni.“'},
{id:'d22',k:'drill',n:'Aut nebo safe?',c:'hra',t:['mety'],e:2,min:6,kids:3,st:1,gear:['Mety', 'Měkké míčky', 'Rukavice', 'Kužely'],gn:'kužely nebo lano na čáry fér',
 dev:'pochopení pravidel: aut, safe, fér a faul; rozhodování, pozornost',
 d:'Trenér ukazuje situace a děti rozhodují. Běžec doběhne na metu dřív než míček do rukavice polaře: všichni ukážou SAFE (ruce do stran). Míček je v rukavici na metě dřív: AUT (pěst nahoru). Pak trenér kutálí nebo odpálí míček a děti hlásí FÉR (míček v poli mezi čarami, skok dopředu) nebo FAUL (mimo čáru, skok dozadu). Děti se střídají v roli běžce a polaře.',
 kid:'„Safe? Ruce do stran! Aut? Pěst nahoru! Fér skok dopředu, faul skok dozadu.“'},
{id:'d23',k:'drill',n:'Přenášení míčků bokem',c:'chytani',t:['warm'],e:3,min:6,kids:1,st:1,gear:['Kužely', 'Měkké míčky'],gn:'2 kužely 3–4 m od sebe, u prvního 3–5 míčků; pro závod dvě řady',
 dev:'přesun bokem bez křížení nohou, nízký postoj polaře, sebrání míče oběma rukama, obratnost',
 d:'Dva kužely 3–4 m od sebe, u prvního leží 3–5 míčků. Dítě stojí v postoji polaře, u prvního kuželu sebere míček nízko oběma rukama („krokodýlí tlama“), posunem bokem (nohy se nekříží) ho odnese k druhému kuželu, položí ho a druhým bokem se vrací pro další. Až přenese všechny, nosí je stejně zpátky. Pro starší a šikovnější lze přidat třetí kužel.',
 va:'Závod dvou řad vedle sebe: vyhrává řada, která dřív přenese všechny míčky. Nebo dítě míček u druhého kuželu nepoloží, ale přendá do rukavice a teprve pak položí.',
 kid:'„Krab nosí vajíčka: bokem, nízko a nohy se nekříží!“'},
{id:'d24',k:'drill',n:'Dva kužely',c:'chytani',t:['warm'],e:3,min:6,kids:1,st:1,gear:['Kužely', 'Měkké míčky'],gn:'2 kužely 3–4 m od středu; měkký nebo tenisový míček',
 dev:'přesun bokem, změna směru, chytání po pohybu, hod na trenéra, obratnost',
 d:'Upravený Two Cone Agility Drill pro U7. Dva kužely 3–4 m na každou stranu od středu, trenér stojí 3–4 m před středem s míčkem. Dítě vyrazí ze středu posunem bokem k jednomu kuželu, dotkne se ho a stejně se vrátí doprostřed. Tam chytí míček od trenéra, hodí ho zpět a udělá dřep. Pak totéž k druhému kuželu. 15–20 sekund nebo 2–3 kola na dítě, pak jde na konec řady.',
 va:'Místo posunu bokem lze střídat sprint, běh pozpátku nebo vysoká kolena. Pro starší místo dřepu klik nebo angličák.',
 kid:'„Bokem ke kuželu, ťuk, bokem zpátky – chyť a hoď!“',
 link:'https://www.dugoutcaptain.com/drill/two-cone-agility-drill/',lt:'Dugout Captain – Two Cone Agility Drill'},
{id:'d25',k:'drill',n:'Krokodýlí tlama od trenéra',c:'chytani',e:1,min:6,kids:2,st:1,gear:['Měkké míčky', 'Rukavice'],gn:'koš míčků pro trenéra',
 dev:'chytání přízemních míčů, postoj, souhra obou rukou',
 d:'Děti stojí v řadě vedle sebe s rozestupy 1,5–2 m, trenér stojí 3–4 m před nimi a kutálí míček po zemi postupně každému v řadě. Chytající má rukavici otevřenou u země („spodní čelist“) a druhou ruku nad ní („horní čelist“). Po chycení tlama zaklapne a dítě míček vrátí trenérovi. Postupně ze stoje a z větší dálky.',
 kid:'„Krokodýl má tlamu dole u země, a když míček přijde – ham!“'},
/* --- RUTINY --- */
{id:'r01',k:'routine',n:'Nástup a pozdrav',c:'rutina',slot:'start',min:3,kids:1,gear:[],
 dev:'struktura tréninku, pozornost',
 d:'Děti se postaví do kruhu nebo na čáru. Trenér přivítá každé dítě jménem, řekne jednou větou, co se dnes naučíme, a připomene hlavní pravidlo dne (např. „pálka jen u trenéra“).',kid:'„Ahoj baseballisti! Dnes se naučíme…“'},
{id:'r02',k:'routine',n:'Signály trenéra',c:'rutina',slot:'start',min:2,kids:1,gear:['Píšťalka'],
 dev:'pořádek na hřišti, rychlé ztišení skupiny',
 d:'Na začátku sezony a pak občas připomenout: ruka nahoře = všichni zvednou ruku a ztichnou; píšťalka = míče na zem a stát; „ke mně“ = přiběhnout do kruhu. Nacvičit jako hru na rychlost.',kid:'„Kdo zvedne ruku nejrychleji?“'},
{id:'r03',k:'routine',n:'Rozcvička zvířátka',c:'rutina',slot:'start',t:['warm'],min:4,kids:1,gear:['Kužely'],gn:'dráha 10–15 m',
 dev:'dynamické rozhýbání, koordinace',
 d:'Děti přecházejí po dráze 10–15 m a cestou mění zvířátka: čáp (vysoká kolena), žabka (skoky snožmo), medvěd (po čtyřech), krab (bokem), zajíc (poskoky), plameňák (stoj na jedné noze 3 vteřiny).',kid:'„A teď jsme… žabky!“'},
{id:'r04',k:'routine',n:'Pití a krátké zhodnocení',c:'rutina',slot:'drink',min:3,kids:1,gear:['Lahve s pitím'],
 dev:'odpočinek, pitný režim',
 d:'Všichni si dojdou pro lahev, posadí se a napijí. Trenér pochválí 2–3 konkrétní věci, které se povedly, a řekne, co následuje.',kid:'„Napít, nadechnout a jdeme dál!“'},
{id:'r05',k:'routine',n:'Rotace stanovišť',c:'rutina',slot:'info',min:1,kids:1,gear:['Píšťalka'],
 dev:'plynulý přesun skupin bez prostojů',
 d:'Na písknutí děti odloží pomůcky, skupina se seřadí do vláčku za trenérem a přejde na další stanoviště po směru hodinových ručiček. Trenér zůstává u svého stanoviště a novou skupinu přivítá.',kid:'„Vláček jede na další stanici!“'},
{id:'r06',k:'routine',n:'Závěrečný kruh a pokřik',c:'rutina',slot:'end',min:4,kids:1,gear:[],
 dev:'zpětná vazba, týmovost',
 d:'Děti v kruhu. Trenér se zeptá: „Co se ti dnes povedlo?“ a nechá odpovědět 3–4 děti. Ocení snahu, ne jen výsledek. Všichni dají ruce doprostřed a zakřičí týmový pokřik.',kid:'„Ruce doprostřed: Eagles!“'},
{id:'r07',k:'routine',n:'Protažení na závěr',c:'rutina',slot:'end',min:3,kids:1,gear:[],
 dev:'zklidnění po tréninku',
 d:'Pomalé protažení vsedě a ve stoje: „sahám na špičky“, „kočička a kráva“ (kulatá a prohnutá záda), kroužky rameny, „strom“ (stoj na jedné noze s rukama nahoře).',kid:'„Teď jsme líní lenochodi.“'},
{id:'r08',k:'routine',n:'Úklid jako závod',c:'rutina',slot:'end',min:3,kids:1,gear:['Tašky na pomůcky'],
 dev:'samostatnost, péče o vybavení',
 d:'Každá skupina dostane úkol (míčky, kužely, pálky do tašky, mety). Trenér odpočítává čas a všichni se snaží překonat rekord z minula.',kid:'„Kdo uklidí svoje dřív? Tři, dva, jedna, teď!“'},
{id:'r09',k:'routine',n:'Kontrola rukavic',c:'rutina',slot:'start',t:['chytani'],min:2,kids:1,gear:['Rukavice'],
 dev:'správná ruka, otevírání rukavice',
 d:'Každé dítě si nasadí rukavici, ukáže, že je na správné ruce (na ruce, kterou neházíme), a třikrát ji „otevře a zavře“ jako tlamu. Trenér zkontroluje zapnutí a velikost.',kid:'„Rukavice zívá: otevřít, zavřít!“'}
,
{id:'r10',k:'routine',n:'Bezpečná zóna pálkaře',c:'rutina',slot:'start',t:['odpal'],min:2,kids:1,gear:['Pálky', 'Helmy', 'Obruče', 'Kužely'],gn:'kužely na kruh kolem domácí mety a čáru pro čekající',
 dev:'bezpečnost na hřišti, pravidla kolem pálky, pořádek při odpalech',
 d:'Na začátku tréninku s odpalem se ukážou a nacvičí tři pravidla: 1) kolem domácí mety je kruh pálkaře, dovnitř smí jen pálkař a trenér; 2) čekající stojí za čarou, pálka se bere do ruky jen na povel trenéra; 3) po švihu jde pálka do obruče, nikdy se neháže. Bez helmy se nepálí. Trenér pravidla nechá zopakovat a pak to děti jednou vyzkouší na sucho.',
 kid:'„V kruhu jen pálkař. Pálka jen na povel. Po švihu pálka do postýlky. Helma vždycky!“'},
{id:'r11',k:'routine',n:'Hledání pokladu',c:'rutina',slot:'end',min:3,kids:1,gear:['Měkké míčky', 'Kbelíky'],
 dev:'úklid po tréninku, spolupráce, počítání',
 d:'Na konci tréninku jsou míčky rozházené po hřišti a v trávě – to je ukrytý poklad. Děti je hledají a nosí do kbelíku, každé smí nést jen jeden míček najednou. U kbelíku se nahlas počítá, kolik pokladu už je doma. Trenér řekne, kolik míčků bylo, a když chybí, hledá se dál. Nejlepší hledač může nést kbelík do tašky.',
 kid:'„Kdo najde nejvíc pokladu? Jeden míček, jedna cesta – a počítáme!“'},
/* --- DOVEDNOSTNÍ RUTINY (progrese pro děti do U8) --- */
{id:'s01',k:'seq',n:'Házecí progrese',c:'hazeni',e:2,min:10,kids:2,st:1,gear:['Měkké míčky', 'Rukavice'],gn:'míček pro dvojici',
 dev:'celý pohyb hodu po částech: úchop, „ukaž psovi míček“, mířit rukavicí, krok, dotažení',
 d:'Dvojice stojí proti sobě 5–7 m (začátečníci blíž). Každý krok má zhruba 10–15 hodů, trenér chodí mezi dvojicemi a opravuje vždy jen jednu věc. Rutina se opakuje na každém tréninku, děti ji brzy zvládnou samy.',
 steps:[{n:'Úchop a „ukaž psovi míček“',min:1,d:'Bez hodu: rozdělit ruce, házecí ruka jde dozadu, míček kouká ven od těla („pejsek za tebou ho vidí“). Rukavice míří na kamaráda.'},
  {n:'Z kolena',min:2,d:'Koleno házecí strany na zemi, druhá noha vpředu. Hod jen z trupu a paže, ruka dotáhne ke kolenu.'},
  {n:'Čelem, z místa',min:2,d:'Stoj čelem, nohy na místě. Rozdělit ruce, kroužek paží, mířit, hod, ruka dotáhne až ke kapse na opačné straně.'},
  {n:'„Fotbalový kop“',min:2,d:'Krok nohou opačnou k házející ruce směrem k cíli a hod. Zadní noha se po hodu přetočí dopředu jako po kopu do míče.'},
  {n:'„Zhoupni a pal“',min:3,d:'Bokem k cíli, zhoupnout váhu na zadní nohu a zpět dopředu, z pohybu hod. Na konci obě dvojice o krok dál od sebe.'}],
 kid:'„Ukaž psovi míček, rukavicí miř, krok – a hoď!“',link:'https://www.baseball.bc.ca/uploads/files/8U%20Practice%20Plans%20FINAL%20DOC%202019(1).pdf',lt:'Baseball BC – 8U Practice Plans (PDF)'},
{id:'s02',k:'seq',n:'Chytací progrese',c:'chytani',e:2,min:8,kids:2,st:1,gear:['Měkké míčky', 'Rukavice'],
 dev:'chytání do rukavice z různých směrů, pohyb k míči, komunikace',
 d:'Dvojice nebo trenér proti řadě dětí, 4–6 m. Hody jsou měkké a pomalé, s každým krokem trochu rychlejší. Vždy chytit, zavřít rukavici a přikrýt druhou rukou, míč přitáhnout ke středu těla.',
 steps:[{n:'Z místa na obě strany',min:2,d:'Hody na rukavicovou i druhou stranu těla, nad i pod pasem. Palečky nahoru u vysokých, malíčky dolů u nízkých.'},
  {n:'Pohyb do strany a dopředu',min:2,d:'Hod trochu vedle, dítě se k míči posune bokem nebo vyběhne dopředu, nečeká na místě.'},

const isWarm=a=>(a.k==='game'||a.k==='seq')&&(a.c==='warm'||(a.t||[]).includes('warm'));

 const tp=S.draft.tpl&&S.tpls[S.draft.tpl],struct=tp?tp.blocks.map(b=>[b.type,+b.min||5,b.mode]):TPL[S.draft.minutes];

let warnedFor=-1;
const csVoices=()=>{try{return window.speechSynthesis?window.speechSynthesis.getVoices().filter(v=>/^cs/i.test(v.lang)):[]}catch(e){return[]}};
function voiceScore(v){const n=v.name;return(/premium|prémiov/i.test(n)?60:0)+(/natural|neural/i.test(n)?55:0)+(/enhanced|vylepšen/i.test(n)?45:0)+(/online/i.test(n)?20:0)+(/google/i.test(n)?30:0)+(/zuzana|vlasta|antonin|antonín/i.test(n)?8:0)+(/compact|eloquence/i.test(n)?-30:0)+(v.localService?2:0)}
function voiceTag(v){const n=v.name;return/premium|prémiov|natural|neural/i.test(n)?'přirozený':/enhanced|vylepšen|google|online/i.test(n)?'lepší':'základní'}
function bestVoice(){const vs=csVoices();if(S.pref.vname){const f=vs.find(v=>v.name===S.pref.vname);if(f)return f}return vs.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0]||null}
function say(t,force){if(!force&&S.pref.voice===false)return;try{const sp=window.speechSynthesis;if(!sp)return;sp.cancel();const u=new SpeechSynthesisUtterance(t),v=bestVoice();if(v)u.voice=v;u.lang=v?v.lang:'cs-CZ';u.rate=+S.pref.vrate||0.95;u.pitch=1;sp.speak(u)}catch(e){}}
try{if(window.speechSynthesis){window.speechSynthesis.getVoices();window.speechSynthesis.addEventListener('voiceschanged',()=>{if(S.tab==='set')render(true)})}}catch(e){}
function voiceSet(){if(!window.speechSynthesis)return'<p class="small muted">Tento prohlížeč hlasová hlášení neumí.</p>';const vs=csVoices().sort((a,b)=>voiceScore(b)-voiceScore(a)),b=vs[0];
 return `<div class="field"><span class="label">Hlas hlášení</span><select id="pf_vname" data-c="vname"><option value="">automaticky${b?' – '+esc(b.name):''}</option>${vs.map(v=>`<option value="${esc(v.name)}" ${S.pref.vname===v.name?'selected':''}>${esc(v.name)} · ${voiceTag(v)}</option>`).join('')}</select></div>
  <div class="field"><span class="label">Tempo řeči</span><select id="pf_vrate" data-c="vrate">${[['0.85','pomalé'],['0.95','klidné'],['1.05','běžné'],['1.15','rychlé']].map(([v,l])=>`<option value="${v}" ${String(S.pref.vrate||'0.95')===v?'selected':''}>${l}</option>`).join('')}</select></div>
  <button class="btn ghost sm" data-a="vtest">▶ Přehrát ukázku</button>
  <p class="small muted">${vs.length?'':'V tomto zařízení není žádný český hlas. '}Přirozenější hlas si stáhneš do telefonu: iPhone → Nastavení → Zpřístupnění → Předčítaný obsah → Hlasy → Čeština → Zuzana (Prémiová nebo Vylepšená). Android → Nastavení → Převod textu na řeč → Google, stáhnout češtinu. Pak tu vyber hlas označený „přirozený“ nebo „lepší“.</p>`}

function parTxt(d){const L=[`⚾ ${d.title}${d.title.indexOf(fmtDate(d.date))<0?' ('+fmtDate(d.date)+')':''}`];
 if(d.week)L.push(`Sezónní plán, týden ${d.week.n}: ${d.week.name}`);
 if((d.focus||[]).length)L.push(`Trénovali jsme: ${d.focus.join(', ').toLowerCase()}`);
 if((d.items||[]).length){L.push('','Co jsme hráli:');d.items.forEach(a=>L.push('• '+a.n+(a.dev?' – rozvíjí: '+a.dev.charAt(0).toLowerCase()+a.dev.slice(1):'')))}
 if((d.whys||[]).length){L.push('','Proč to děláme:');d.whys.forEach(y=>L.push('• '+(y.c?y.c+': ':'')+y.t))}
 if((d.learn||[]).length)L.push('','Nově se učíme: '+d.learn.map(a=>a.n+' ('+a.steps.join(' → ').toLowerCase()+')').join('; '));
 if(d.hw)L.push('','🏠 Na doma (5 minut): '+d.hw);
 if(d.note)L.push('','💬 '+d.note);
 return L.join('\n')}

function vPlanOut(){
 const p=S.plan;let t=0;const total=p.blocks.reduce((s,b)=>s+b.min,0);
 const blocks=p.blocks.map((b,bi)=>{

 pdel:async v=>{const t=clone(team());t.players=t.players.filter(p=>p.num!==v);await saveTeam(t)},
 impinto:async()=>{const t=clone(team());const old=new Map((t.players||[]).map(p=>[p.num,p.lvl||'']));t.players=S.imp.R.players.map(p=>({num:String(p.num),name:p.name||'',lvl:old.get(String(p.num))||''}));S.imp=null;await saveTeam(t);toast('Soupiska převzata.')},
 impnew:async()=>{const id='t'+uid();const r=S.imp.R;S.imp=null;S.teamId=id;ls.set('u7-team',id);await Store.put('teams',id,{name:r.name||'Tým',players:r.players.map(p=>({num:String(p.num),name:p.name||'',lvl:''})),coaches:[]});toast('Tým přidán.')},
 impno:()=>{S.imp=null;render(true)},
 load:v=>{parkCurrent();S.plan=clone(S.plans[v]);S.draft.name=S.plan.name||'';S.draft.week=S.plan.week||0;S.draft.teamsSel=planTeams(S.plan).filter(t=>S.teams[t]);S.draft.minutes=S.plan.minutes;selectCoachesByNames(S.plan.coaches||[]);S.draft.date=S.plan.date;saveDraft();savePlan();S.run={i:0,left:null,endAt:null,running:false,auto:S.run.auto};saveRun();actions.tab('train')},
 dup:v=>{parkCurrent();const p=clone(S.plans[v]);S.draft.teamsSel=planTeams(p).filter(t=>S.teams[t]);p.teams=selTeams();p.team=p.teams[0];p.id=uid();p.date=today();p.present=presentKeys();p.coaches=coachNames();S.plan=p;S.draft.date=p.date;const cc=coachCount();p.groups=makeGroups(p.present,cc>=2?cc:1,S.draft.mix!==false);fitBlocks();saveDraft();savePlan();S.run={i:0,left:null,endAt:null,running:false,auto:S.run.auto};saveRun();actions.tab('train')},
 hfav:v=>{S.hist.fav=v==='1';render(true)},hmine:v=>{S.hist.mine=v==='1';render(true)},
 hfocus:v=>{S.hist.focus=v;render(true)},
 fav:async v=>{const p=clone(S.plans[v]);if(!p)return;p.fav=!p.fav;try{await Store.put('plans',v,p);if(S.plan&&S.plan.id===v){S.plan.fav=p.fav;savePlan()}toast(p.fav?'Přidáno do oblíbených.':'Odebráno z oblíbených.')}catch(e){}},
 askplan:v=>{S.confirm='p_'+v;render(true)},
 delplan:async v=>{S.confirm=null;await Store.del('plans',v);render(true)}
};
function gotoStep(i){const st=steps();if(i<0||i>=st.length)return;S.run.i=i;const s=st[i];beeped=false;if(S.run.running){S.run.endAt=Date.now()+s.min*60000;S.run.left=null;announce()}else S.run.left=null;saveRun();render(true)}
document.addEventListener('click',e=>{if(S.menu&&!e.target.closest('.menu')){S.menu=false;render(true)}const b=e.target.closest('[data-a]');if(!b){if(e.target.id==='sheet')closeSheet();return}if(b.disabled)return;const f=actions[b.dataset.a];if(f){e.preventDefault();f(b.dataset.v,b)}});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(S.menu){S.menu=false;render(true)}else if(!$('#sheet').hidden)closeSheet()});
$('#teamSel').addEventListener('change',e=>actions.team(e.target.value));
document.addEventListener('input',e=>{const id=e.target.id;if((id==='parHw'||id==='parNote')&&S.plan){const t=$('#parentsTxt');if(t)t.value=parTxt(pubData(S.plan))}});
document.addEventListener('input',e=>{const el=e.target,c=el.dataset.c;if(!c)return;
 if(c==='libq'){S.lib.q=el.value;renderLibList()}
 else if(c==='histq'){S.hist.q=el.value;renderHistList()}
});
document.addEventListener('change',async e=>{const el=e.target,c=el.dataset.c;if(!c)return;
 if(c==='date'){S.draft.date=el.value||today();saveDraft();if(S.plan){S.plan.date=S.draft.date;savePlan()}render()}
 else if(c==='trname'){S.draft.name=el.value;saveDraft()}
 else if(c==='planote'){S.plan.note=el.value;savePlan();if(S.plans[S.plan.id])savePlanToHistory(true).catch(()=>{})}
 else if(c==='mksk'){S.mk=el.value;openMk()}
 else if(c==='btype'){setBlockType(+el.dataset.b,el.value)}
 else if(c==='addbtype'){if(el.value)addBlock(el.value);el.value=''}
 else if(c==='voice'){S.pref.voice=el.checked;savePref();if(el.checked)say('Hlášení zapnuto.')}
 else if(c==='vname'){S.pref.vname=el.value;savePref();say('Ahoj děti, jdeme na to!',true)}
 else if(c==='vrate'){S.pref.vrate=el.value;savePref();say('Ještě minuta.',true)}
 else if(c==='skill'){const t=clone(team()),pl=t.players.find(x=>x.num===el.dataset.p);if(!pl)return;const sk=skOf(pl);pl.sk=el.checked?[...new Set(sk.concat([el.dataset.v]))]:sk.filter(x=>x!==el.dataset.v);await saveTeam(t);openKid(el.dataset.p)}
 else if(c==='planname'){S.plan.name=el.value.trim();savePlan();render(true)}
 else if(c==='gear'){S.gear[el.dataset.v]=el.checked}
 else if(c==='auto'){S.run.auto=el.checked;saveRun()}
 else if(c==='tname'){const t=clone(team());t.name=el.value.trim()||'Tým';await saveTeam(t)}
 else if(c==='cname'){const t=clone(team());const cs=coachesOf(t);const x=cs.find(c=>c.id===el.dataset.v);const nv=el.value.trim();if(x&&nv){x.name=nv;t.coaches=cs;await saveTeam(t)}else render(true)}
 else if(c==='theme'){S.pref.theme=el.value;savePref();applyTheme()}
 else if(c==='mix'){S.draft.mix=el.checked;saveDraft()}
 else if(c==='wxh'){S.pref.wx=Object.assign({},S.pref.wx,{h:+el.value});savePref();render(true)}
 else if(c==='wake'){S.pref.wake=el.checked;savePref();if(!el.checked)lock(false)}
 else if(c==='pname'){const t=clone(team());const p=t.players.find(p=>p.num===el.dataset.v);if(p){p.name=el.value.trim();await saveTeam(t)}}
 else if(c==='pnum'){const t=clone(team()),old=el.dataset.v;let nv=el.value.trim().replace(/^0+(?=\d)/,'');
  if(nv&&!/^\d{1,3}$/.test(nv)){toast('Číslo dresu má 1–3 číslice.');render(true);return}
  if(!nv){if(noNum(old))return;nv='~'+uid().slice(-6)}
  if(t.players.some(p=>p.num===nv&&p.num!==old)){toast('Číslo '+nv+' už má někdo jiný.');render(true);return}
  const p=t.players.find(p=>p.num===old);if(!p)return;p.num=nv;renumber(old,nv);await saveTeam(t)}
 else if(c==='imp'){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const b=JSON.parse(r.result);const R=b&&(b.R||(b.kind==='team'&&b.R));if(!R||!Array.isArray(R.players))throw 0;S.imp={R:{name:R.name||'',players:R.players.filter(p=>p&&p.num!=null)}};render(true)}catch(x){toast('Tohle není soubor týmu ze zápisníku.')}};r.readAsText(f)}
});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;
 if(f.id==='addC'){const name=$('#nc_name').value.trim();if(!name)return toast('Napiš jméno trenéra.');const t=clone(team());const cs=coachesOf(t);if(cs.some(c=>c.name.toLowerCase()===name.toLowerCase()))return toast(name+' už v seznamu je.');const id='c'+uid();cs.push({id,name});t.coaches=cs;
  Object.keys(S.draft.coachSel).forEach(k=>{if(k.split('+').includes(S.teamId))S.draft.coachSel[k].push(K(S.teamId,id))});saveDraft();await saveTeam(t);render(true);const n=$('#nc_name');if(n)n.focus();return}
 if(f.id==='tplForm'){const name=$('#tpl_name').value.trim();if(!name)return toast('Napiš název šablony.');const id='p'+uid();await Store.put('tpls',id,{name,blocks:S.plan.blocks.map(b=>({type:b.type,min:b.min,mode:b.mode==='st'?'st':'same'}))});S.tplForm=false;toast('Šablona uložena. Najdeš ji v Plánování.');render(true);return}
 if(f.id==='addGuest'){const name=$('#g_name').value.trim();if(!name)return;S.draft.guests[selKey()]=guests().concat([name]);saveDraft();render(true);return}
 if(f.id==='addGuestT'){const name=$('#gt_name').value.trim();if(!name)return;S.draft.guests[selKey()]=guests().concat([name]);saveDraft();applyCoaches();return}
 if(f.id==='addP'){const raw=$('#np_num').value.trim().replace(/^0+(?=\d)/,''),name=$('#np_name').value.trim();if(!name)return toast('Napiš jméno dítěte.');if(raw&&!/^\d{1,3}$/.test(raw))return toast('Číslo dresu má 1–3 číslice.');const num=raw||'~'+uid().slice(-6);const t=clone(team());if(t.players.some(p=>p.num===num))return toast('Číslo '+num+' už v soupisce je.');t.players.push({num,name,lvl:''});
  const pr=S.draft.present[S.teamId];if(pr){pr.push(num);saveDraft()}await saveTeam(t);render(true);const n=$('#np_num');if(n)n.focus()}
 if(f.id==='actForm'){const g=id=>$(id).value;const d={n:g('#f_n').trim(),k:g('#f_k'),c:g('#f_c'),min:Math.max(1,+g('#f_min')||5),kids:Math.max(1,+g('#f_kids')||1),gear:[...document.querySelectorAll('#actForm [data-gear]')].filter(x=>x.checked).map(x=>x.dataset.gear).concat(g('#f_gear').split(',').map(x=>x.trim()).filter(Boolean).map(x=>x.replace(/^./,ch=>ch.toUpperCase()))).filter((x,i,arr)=>arr.indexOf(x)===i),gn:g('#f_gn').trim(),d:g('#f_d').trim(),kid:g('#f_kid').trim(),dev:g('#f_dev').trim(),st:$('#f_st').checked?1:0,e:2,t:$('#f_warm').checked?['warm']:[]};
  if(d.k==='routine')d.slot='start';if(!d.n)return toast('Doplň název.');const id=f.dataset.id||uid();await Store.put('custom',id,d);closeSheet();toast('Uloženo.');if(S.tab==='lib')render(true)}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.run.running)lock(true)});

applyTheme(true);syncLine();Store.start();
